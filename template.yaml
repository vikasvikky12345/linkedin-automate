AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Daily "Learn AWS with Vikas" LinkedIn posts, approved by email

Parameters:
  GithubRepo:
    Type: String
    Default: vikasvikky12345/linkedin-automate
  LinkedinVersion:
    Type: String
    Default: '202609' # YYYYMM; LinkedIn retires versions after ~1 year, bump if posts start failing

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags: [{ Key: project, Value: linkedin-agent }] # cost split on the dashboard
      LifecycleConfiguration:
        Rules:
          - { Id: old-posts, Prefix: posts/, Status: Enabled, ExpirationInDays: 14 }
          - { Id: old-media, Prefix: media/, Status: Enabled, ExpirationInDays: 14 }

  # Spend and usage for the dashboard (see "Usage table" in src/index.js).
  Usage:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      Tags: [{ Key: project, Value: linkedin-agent }]

  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/linkedin-agent
      RetentionInDays: 14
      Tags: [{ Key: project, Value: linkedin-agent }]

  Agent:
    Type: AWS::Serverless::Function
    DependsOn: Logs
    Properties:
      FunctionName: linkedin-agent
      CodeUri: src/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [x86_64] # the npm chromium build is x86 only
      MemorySize: 2048
      Timeout: 900 # the 2 PM video is ~600 rendered frames
      Tags: { project: linkedin-agent }
      Environment:
        Variables:
          BUCKET: !Ref Bucket
          TABLE: !Ref Usage
          GITHUB_REPO: !Ref GithubRepo
          LINKEDIN_VERSION: !Ref LinkedinVersion
      FunctionUrlConfig:
        AuthType: NONE
      EventInvokeConfig:
        MaximumRetryAttempts: 0 # a retried draft would email a second batch
      Policies:
        - S3CrudPolicy: { BucketName: !Ref Bucket }
        - DynamoDBCrudPolicy: { TableName: !Ref Usage }
        - Statement:
            - Effect: Allow
              Action: ssm:GetParametersByPath
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/linkedin-agent
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/linkedin-agent/*
            - Effect: Allow
              Action: ce:GetCostAndUsage
              Resource: '*'
            - Effect: Allow
              Action: lambda:GetFunctionUrlConfig
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:linkedin-agent
      Events:
        Draft:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 9 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"job":"draft"}'
            RetryPolicy: { MaximumRetryAttempts: 0 }
        Publish:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 10,14,19 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"job":"publish"}'
            RetryPolicy: { MaximumRetryAttempts: 0 }
        Market:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 10 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"job":"market"}'
            RetryPolicy: { MaximumRetryAttempts: 0 }
        Costs:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(45 8 * * ? *) # before the 9 AM draft, whose email shows yesterday's spend
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"job":"costs"}'
            RetryPolicy: { MaximumRetryAttempts: 0 }
        Ideas:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 10 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"job":"ideas"}'
            RetryPolicy: { MaximumRetryAttempts: 0 }

  # Public function URLs also need InvokeFunction (AWS change, Oct 2025).
  AgentUrlInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Agent
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  AppUrl:
    Description: Add <AppUrl>callback to the LinkedIn app's redirect URLs
    Value: !GetAtt AgentUrl.FunctionUrl
